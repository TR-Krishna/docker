name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
   contents: read
   packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Login to Docker Hub
        # uses: docker/login-action@v3
        # with:
          # username: ${{ secrets.DOCKERHUB_USERNAME }}
          # password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Meter API
        uses: docker/build-push-action@v5
        with:
          context: ./ApiMeter
          push: true
          tags: ghcr.io/tr-krishna/apimeter:latest
          # tags: krishnatr/apimeter:latest

      - name: Build and push Order API
        uses: docker/build-push-action@v5
        with:
          context: ./DemoOrder
          push: true
          tags: ghcr.io/tr-krishna/orderapi:latest
          # tags: krishnatr/orderapi:latest
          
  deploy : 
        runs-on : self-hosted
        needs : build-and-push
        steps : 
          - name : Deploy
            run : |
                cd C:\Users\SESA845697\source\repos\microservices_docker
                docker compose pull
                docker compose up -d
                docker compose ps     
          - name : Deploy to Kubernetes
            run : |
                kubectl rollout restart deployment/apimeter-deployment -n microservices
                kubectl rollout restart deployment/orderapi -n microservices
                kubectl rollout status deployment/apimeter-deployment -n microservices
                kubectl rollout status deployment/orderapi -n microservices