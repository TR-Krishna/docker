apiVersion: v1
kind: ConfigMap
metadata:
    name: nginx-config
    namespace: microservices
data: 
    nginx.conf: |
        # events {}

        # http {
        #     upstream apimeter {
        #         server apimeter-service:8080;
        #     }
        #     upstream orderapi{
        #         server orderapi-service:8080;
        #     }

        #     server
        #     {
        #         listen 80;
                
        #          location /meter/ {
        #             rewrite ^/meter/(.*) /$1 break;
        #             proxy_pass http://apimeter;
        #             proxy_set_header Host $host;
        #             proxy_set_header X-Real-IP $remote_addr;
        #         }

        #         location /order/ {
        #             rewrite ^/order/(.*) /$1 break;
        #             proxy_pass http://orderapi;
        #             proxy_set_header Host $host;
        #             proxy_set_header X-Real-IP $remote_addr;
        #         }
        #   }
        #  }
         events {}

         http {
            upstream apimeter {
                server apimeter:8080;
            }

            upstream orderapi {
                server orderapi:8080;
            }

            server {
                listen 80;

                location /api/meter/swagger/ {
                    proxy_pass http://apimeter/swagger/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location /api/order/swagger/ {
                    proxy_pass http://orderapi/swagger/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location /api/meter/ {
                    proxy_pass http://apimeter/api/meter/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location /api/order/ {
                    proxy_pass http://orderapi/api/order/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location /api/Auth {
                    proxy_pass http://apimeter/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

                location /api/Meter {
                    proxy_pass http://apimeter;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            
                location /api/Order {
                    proxy_pass http://orderapi;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }

            }
        }